{% extends "_base/auth_base.html" %}
{% block title %}Forgot Password - Somali MD{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="auth-logo">
        <i class="fas fa-key"></i>
    </div>
    <h2 class="auth-title">Forgot Password?</h2>
    <p class="auth-subtitle">Enter your email to receive a reset OTP code</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <div style="margin-bottom:24px;">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" class="form-input" id="email" name="email"
                   placeholder="Enter your registered email" required autofocus>
        </div>

        <button type="submit" class="btn-modern primary full">
            <i class="fas fa-paper-plane"></i> Send OTP Code
        </button>
    </form>

    <p style="text-align:center;margin-top:24px;font-size:13px;color:var(--text-muted);">
        <a href="{{ url_for('auth.login') }}" style="color:var(--primary);font-weight:600;text-decoration:none;">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </p>
</div>
{% endblock %}
