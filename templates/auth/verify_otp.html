{% extends "_base/auth_base.html" %}
{% block title %}Verify Email - Somali MD{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="auth-logo">
        <i class="fas fa-envelope-circle-check"></i>
    </div>
    <h2 class="auth-title">Verify Your Email</h2>
    <p class="auth-subtitle">Enter the 6-digit code sent to your email</p>

    <div style="text-align:center;margin-bottom:20px;">
        <span style="font-size:14px;color:var(--text-muted);word-break:break-all;">{{ email }}</span>
    </div>

    <form method="POST" action="{{ url_for('auth.verify_otp') }}">
        <input type="hidden" name="email" value="{{ email }}">

        <div style="margin-bottom:24px;">
            <label class="form-label" for="otp">OTP Code</label>
            <input type="text" class="form-input" id="otp" name="otp"
                   placeholder="Enter 6-digit code" required maxlength="6"
                   pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code"
                   style="text-align:center;font-size:24px;letter-spacing:10px;font-weight:700;">
        </div>

        <button type="submit" class="btn-modern primary full">
            <i class="fas fa-check-circle"></i> Verify Email
        </button>
    </form>

    <p style="text-align:center;margin-top:24px;font-size:13px;color:var(--text-muted);">
        Didn't get the code?
        <form method="POST" action="{{ url_for('auth.resend_otp') }}" style="display:inline;margin:0;">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="purpose" value="verify">
            <button type="submit" style="background:none;border:none;color:var(--primary);font-weight:600;font-size:13px;cursor:pointer;padding:0;text-decoration:underline;">
                Resend OTP
            </button>
        </form>
    </p>

    <p style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-muted);">
        <a href="{{ url_for('auth.login') }}" style="color:var(--primary);font-weight:600;text-decoration:none;">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </p>
</div>
{% endblock %}
